[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.13.9,<0.14" ]

[project]
name = "bcoder"
version = "3.0"
description = "Tool to decode and encode .torrent files"
readme = "README.md"
license = "MIT"
license-files = [ "LICENSE" ]
authors = [ { name = "Mykola Bezrukyi" } ]
requires-python = ">=3.12"
urls.Homepage = "https://github.com/mbezrukyi/bcoder"

[dependency-groups]
dev = [ "pytest" ]
